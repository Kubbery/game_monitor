name: Game Monitor Automation

on:
  schedule:
    # UTC 时间 01:00，相当于北京时间每天早上 09:00 运行
    - cron: '0 1 * * *'
  workflow_dispatch: # 支持在 GitHub 页面手动点击触发测试

jobs:
  run-script:
    runs-runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行监控脚本
        env:
          WECHAT_WORK_CORPID: ${{ secrets.WECHAT_WORK_CORPID }}
          WECHAT_WORK_SECRET: ${{ secrets.WECHAT_WORK_SECRET }}
          WECHAT_WORK_AGENTID: ${{ secrets.WECHAT_WORK_AGENTID }}
        run: python monitor.py